[package]
name = "uob_radio"
version = "0.1.0"
authors = ["Thomas Epperson <thomas.epperson@gmail.com>"]
edition = "2018"
resolver = "2"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uob_radio-desktop"
path = "gen/bin/desktop.rs"

[package.metadata.cargo-android]
app-dependencies = [
    "com.google.android.material:material:1.8.0",
]
project-dependencies = [ "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21" ]
app-plugins = [ "org.jetbrains.kotlin.android" ]
app-theme-parent = "Theme.MaterialComponents.DayNight.DarkActionBar"

[dependencies] 
log = "0.4.14"
chrono = "0.4"
pollster = "0.2"
egui = "0.31.1"
wgpu = "25.0.0"
winit = { version = "0.30.7", features = ["android-native-activity"] }
egui_demo_lib = "0.31.1"
egui-winit = { version = "0.31.1", default-features = false, features=["android-native-activity"] }
egui-wgpu = { version = "0.31.1", features = [ "winit" ] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.9"
