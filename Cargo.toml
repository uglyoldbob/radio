[package]
name = "radio-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
android-auto = { path = "./android-auto", optional = true }
async-trait = "0.1.88"
bincode = {version = "2.0.1", features = ["serde"]}
bluetooth-rust = { version = "0.2.4", optional = true}
chrono = "0.4.43"
clap = { version = "4.5.38", features = ["derive"] }
cpal = "0.15.3"
eframe = { version = "0.31.1" }
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
egui_virtual_keyboard = { git = "https://github.com/guspower/egui_virtual_keyboard.git", branch="egui-0.31.0" }
enum_dispatch = "0.3.13"
ffimage = "0.10.0"
ffimage_yuv = "0.10.0"
futures-util = "0.3.32"
image = { version = "0.25.2", features = ["jpeg", "png"] }
json = "0.12.4"
log = "0.4.27"
openh264 = "0.8.1"
qrcode = { version = "0.14.1", optional = true}
reqwest = { version = "0.13.2", features = ["stream"] }
ringbuf = "0.4.8"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.149"
simple_logger = "5.0.0"
swupdate-ipc = { path = "./swupdate-ipc", optional=true }
tokio = { version = "1.40.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
toml = "0.8.20"
uobradio-comms = { path = "./uobradio-comms" }
zbus = "5.13.2"
zvariant = "5.9.2"

[dependencies.service]
path = "./service/service"
features = ["async", "serde", "prompt", "egui-prompt"]

[target.'cfg(target_os = "linux")'.dependencies]
nmrs = { version = "2.0.0", optional = true }

[[bin]]
name = "radio_service"
path = "src/service.rs"

[[bin]]
name = "radio_gui"
path = "src/main.rs"

[features]
default = ["wifi", "bluetooth", "androidauto"]
wifi = ["dep:qrcode", "dep:nmrs", "uobradio-comms/wifi", "android-auto?/wireless"]
bluetooth = ["dep:bluetooth-rust", "uobradio-comms/bluetooth"]
androidauto = ["dep:android-auto", "uobradio-comms/androidauto"]
swupdate = ["dep:swupdate-ipc"]
test = ["uobradio-comms/test"]

#this patch is needed for the v1 certificate in the android-auto crate of src/cert.rs
[patch.crates-io]
rustls-webpki = { git = "https://github.com/uglyoldbob/webpki", branch = "main5" }